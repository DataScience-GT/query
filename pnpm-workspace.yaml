packages:
  - sites/*
  - packages/*
  - tooling/*

catalog:
  "@astrojs/react": 7.1.9
  "@babel/parser": 7.29.13
  "@modelcontextprotocol/sdk": 1.32.2
  "@next/bundle-analyzer": 16.4.5
  "@tailwindcss/postcss": 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-query": 5.105.0
  "@trpc/client": 11.19.0
  "@trpc/react-query": 11.19.0
  "@trpc/server": 11.19.0
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  astro: 7.4.12
  drizzle-orm: 0.45.4
  eslint-plugin-turbo: 2.11.10
  next: 16.4.5
  next-auth: 5.0.0-beta.32
  oxlint: 1.90.0
  oxlint-tsgolint: 7.0.2005
  postcss: 8.5.33
  prettier: 3.9.10
  react: 19.3.1
  react-dom: 19.3.1
  stripe: 23.1.0
  superjson: 2.2.6
  tailwindcss: 4.3.3
  tsrs: 0.20.1-ts7.1.0-beta
  turbo: 2.11.10
  typescript: 7.0.2
  vite: 7.3.7
  vitest: 5.0.3
  zod: 4.6.6

# Astro 7 runs on vite 8, and @astrojs/react takes vite as a peer from the
# site, so the Astro sites name it themselves. Everything else stays on the
# default catalog's vite.
catalogs:
  astro:
    vite: 8.3.5

overrides:
  postcss: ^8.5.23
  esbuild: ^0.25.12
  ws: ^8.20.1
  "@auth/core": ^0.41.3
  "@grpc/grpc-js": ^1.14.4
  websocket-driver: ^0.7.5
  protobufjs: ^7.6.5
  js-yaml: ^4.3.0
  undici: ^6.27.0
  sharp: ^0.35.0
  "vite@<7.3.7": ^7.3.7
  brace-expansion: ^5.0.9
  gaxios>uuid: ^11.1.1
  source-map-js: ^1.2.2
  minimatch: ^11.0.3
  fast-xml-parser: ^5.12.0
  astro>vite: 8.3.5
  "@vitejs/plugin-react>vite": 8.3.5

autoInstallPeers: false
publicHoistPattern:
  - "*prettier*"
frozenLockfile: false

# pnpm 11+ fails the install on any dependency with an unreviewed build
# script. Both were already skipped under pnpm 10; false keeps that, as an
# explicit decision.
allowBuilds:
  "@parcel/watcher": false
  esbuild: false
