packages:
  - apps/*
  - sites/*
  - packages/*
  - tooling/*
  - packages/api
  - packages/auth
  - packages/db
  - packages/ui

# Moved here from package.json's `pnpm.overrides` when the repo went to pnpm
# 12, which stopped reading that field. These are security pins on transitive
# dependencies — losing them silently reinstates vulnerable versions, and pnpm
# only warns about the ignored field once.
overrides:
  postcss: ^8.5.23
  esbuild: ^0.25.12
  ws: ^8.20.1
  "@eslint/plugin-kit": ^0.3.4
  "@auth/core": ^0.41.3
  "@grpc/grpc-js": ^1.14.4
  websocket-driver: ^0.7.5
  protobufjs: ^7.6.5
  js-yaml: ^4.3.0
  undici: ^6.27.0
  sharp: ^0.35.0
  vite: ^7.3.5
  brace-expansion: ^5.0.9

# pnpm 12 replaced ignoredBuiltDependencies with allowBuilds and turned an
# undeclared build script into a hard error, where 10 only warned. Both of
# these were already skipped under pnpm 10 and every build passed, so `false`
# records the status quo rather than newly denying anything.
allowBuilds:
  "@parcel/watcher": false
  esbuild: false

# Migrated from .npmrc, which pnpm 12 no longer reads for settings. Dropping
# publicHoistPattern is what broke `pnpm --filter @query/api lint`: packages
# that never declared eslint were running the hoisted copy.
autoInstallPeers: false
frozenLockfile: false
publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
