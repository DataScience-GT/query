# Monorepo - app is in sites/portal

scripts:
  buildCommand: pnpm --filter web build && mkdir -p sites/mainweb/.next/standalone/sites/mainweb/.next && cp -r sites/mainweb/.next/static sites/mainweb/.next/standalone/sites/mainweb/.next/static && (cp -r sites/mainweb/public sites/mainweb/.next/standalone/sites/mainweb/public || true)
  runCommand: node sites/mainweb/.next/standalone/sites/mainweb/server.js

runConfig:
  runtime: nodejs20
  concurrency: 80
  cpu: 2
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 10

env:
  - variable: PORT
    value: "8080"
  - variable: HOSTNAME
    value: "0.0.0.0"
  - variable: DATABASE_URL
    secret: DATABASE_URL
  - variable: AUTH_SECRET
    secret: AUTH_SECRET
  - variable: NEXTAUTH_SECRET
    secret: AUTH_SECRET
  - variable: GOOGLE_CLIENT_ID
    secret: AUTH_GOOGLE_ID
  - variable: GOOGLE_CLIENT_SECRET
    secret: AUTH_GOOGLE_SECRET
  - variable: AUTH_URL
    value: https://datasciencegt.org
  - variable: NEXTAUTH_URL
    value: https://datasciencegt.org
  - variable: STRIPE_SECRET_KEY
    secret: projects/672446353769/secrets/STRIPE_SECRET_KEY
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret: projects/672446353769/secrets/NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
  - variable: STRIPE_WEBHOOK_SECRET
    secret: projects/672446353769/secrets/STRIPE_WEBHOOK_SECRET
  - variable: NODE_ENV
    value: production
  - variable: EMAIL_SERVER_HOST
    value: smtp.gmail.com
  - variable: EMAIL_SERVER_PORT
    value: "587"
  - variable: EMAIL_SERVER_USER
    value: datascience.gt@gmail.com
  - variable: EMAIL_SERVER_PASSWORD
    secret: projects/672446353769/secrets/EMAIL_SERVER_PASSWORD
  - variable: EMAIL_FROM
    value: datascience.gt@gmail.com