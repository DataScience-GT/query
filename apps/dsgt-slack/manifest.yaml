_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: dsgt
  description: Official Slack bot for Data Science @ Georgia Tech (DS@GT).
  background_color: "#003057"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: dsgt
    always_online: true
  slash_commands:
    - command: /dsgt
      description: Ask the Data Science @ Georgia Tech bot for help.
      usage_hint: "[help | ping | join]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - im:history
      - im:read
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
