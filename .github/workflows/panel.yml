name: panel

on:
  push:
    paths:
      - "judging/**"
      - ".github/workflows/panel.yml"
  pull_request:
    paths:
      - "judging/**"
      - ".github/workflows/panel.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @panel/core --filter @panel/db --filter @panel/server --filter @panel/cli --filter @panel/web lint
      - run: pnpm --filter @panel/core --filter @panel/db --filter @panel/server --filter @panel/cli --filter @panel/web typecheck
      - run: pnpm --filter @panel/core build
      - run: pnpm --filter @panel/web build
      - run: pnpm --filter @panel/core --filter @panel/server --filter @panel/cli test

  publish:
    if: startsWith(github.ref, 'refs/tags/panel-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: judging/infra/docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/panel-server:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: judging/infra/docker/Dockerfile.web
          push: true
          build-args: NEXT_PUBLIC_PANEL_URL=${{ vars.NEXT_PUBLIC_PANEL_URL || 'http://localhost:8787' }}
          tags: ghcr.io/${{ github.repository }}/panel-web:${{ github.ref_name }}

  release-core:
    if: startsWith(github.ref, 'refs/tags/panel-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @panel/core build
      - working-directory: judging/core
        run: npm pkg set private=false && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
