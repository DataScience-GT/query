name: Auto PR dev to main

on:
  push:
    branches:
      - dev

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create or Update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only "a PR already exists" is expected; anything else should fail
          # the job rather than be swallowed by || true. Same-repo PRs only: a
          # fork's branch of the same name must not suppress this one.
          open=$(gh pr list --head dev --base main --state open --json isCrossRepository --jq '[.[] | select(.isCrossRepository | not)] | length')
          if [ "$open" = "0" ]; then
            gh pr create \
              --base main \
              --head dev \
              --title "Sync: dev to main" \
              --body "Automated PR tracking changes from \`dev\` into \`main\`." \
              --reviewer aamoghS \
              --assignee aamoghS \
              --label ":arrow_heading_down: pull"
          fi
