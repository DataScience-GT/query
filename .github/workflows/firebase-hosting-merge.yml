name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repository
      - uses: actions/checkout@v4

      # 2️⃣ Install dependencies (including @supabase/ssr)
      - name: Install dependencies
        run: npm ci

      # 3️⃣ Build Next.js project
      - name: Build
        run: npm run build

      # 4️⃣ Deploy to Firebase Hosting live channel
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HACKLYTICS2025 }}
          channelId: live
          projectId: hacklytics2025
