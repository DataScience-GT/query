name: Run Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        # No version pin: the one in packageManager is the one that reads
        # overrides and allowBuilds from pnpm-workspace.yaml. Pinning here
        # silently installed an older pnpm that ignores both.
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install

      - name: Run unique test cases
        run: pnpm test
