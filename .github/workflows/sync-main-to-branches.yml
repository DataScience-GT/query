name: Sync main to work branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge main into matching branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branches=$(git for-each-ref --format='%(refname:strip=3)' \
            'refs/remotes/origin/feature/*' \
            'refs/remotes/origin/fix/*' \
            'refs/remotes/origin/rework/*' \
            'refs/remotes/origin/refactor/*' \
            'refs/remotes/origin/hackaton/*')

          echo "## Sync main to work branches" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$branches" ]; then
            echo "No matching branches." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for b in $branches; do
            if git merge-base --is-ancestor origin/main "origin/$b"; then
              echo "- \`$b\`: already up to date" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            git checkout -B "$b" "origin/$b"

            if git merge --no-edit origin/main; then
              if git push origin "$b"; then
                echo "- \`$b\`: synced" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- \`$b\`: push rejected (protected branch?)" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              git merge --abort
              echo "- \`$b\`: merge conflict, skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
