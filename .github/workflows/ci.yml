name: CI/CD

# One pipeline: every PR and every push to main/dev is linted, typechecked,
# tested and built once. Hacklytics deploys only from that verified build —
# a preview channel per PR, live on main. mainweb is not deployed here:
# Firebase App Hosting builds it from main itself (apphosting.yaml).
on:
  push:
    branches: ["main", "dev"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Start only the database now, in the background, so the image pull and
      # boot overlap install and lint/typecheck. Mailpit is not used by tests.
      # The marker file tells the next database step when this has finished.
      - name: Start test database in the background
        run: |
          nohup setsid bash -c '
            docker compose -f docker/compose.local.yml -f docker/compose.ci.yml up -d db
            echo $? > "$RUNNER_TEMP/db-up.exit"
          ' > "$RUNNER_TEMP/db-up.log" 2>&1 &

      # Bun installs and runs the scripts. Firebase App Hosting still builds
      # with pnpm from the same pnpm-lock.yaml, so that file stays the one
      # source of truth and Bun only reads it. The scripts themselves still run
      # on Node 24 from .nvmrc, as they do on App Hosting.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      # Downloads only, keyed by the lockfile Bun reads. Integrity is checked
      # against pnpm-lock.yaml on every install, so a stale cache is harmless.
      - name: Restore Bun package cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: bun-${{ runner.os }}-

      # No bun.lock is committed. With only pnpm-lock.yaml, --frozen-lockfile
      # migrates it in memory, versions and integrity hashes included, and
      # fails if it disagrees with a package.json. --ignore-scripts matches
      # allowBuilds in pnpm-workspace.yaml: no dependency runs a build script.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Fails if what Bun put in node_modules differs from what pnpm would
      # install from pnpm-lock.yaml: a package, a version a package links to,
      # or a patch that is not applied.
      - name: Check the install matches pnpm-lock.yaml
        run: bun tooling/scripts/src/install-parity.ts

      # packageManager says pnpm, which App Hosting reads, so turbo runs each
      # task as `pnpm run <script>`. Real pnpm would reinstall over Bun's
      # node_modules first. This pnpm only forwards `run` to Bun, and turbo
      # still keys its cache on pnpm-lock.yaml.
      - name: Run turbo's tasks with Bun
        run: |
          mkdir "$RUNNER_TEMP/pnpm-shim"
          cat > "$RUNNER_TEMP/pnpm-shim/pnpm" <<'EOF'
          #!/bin/sh
          [ "$1" = run ] || { echo "pnpm shim: only 'pnpm run' is supported, got: $*" >&2; exit 1; }
          shift
          exec bun run "$@"
          EOF
          chmod +x "$RUNNER_TEMP/pnpm-shim/pnpm"
          echo "$RUNNER_TEMP/pnpm-shim" >> "$GITHUB_PATH"

      # Each run saves under its own sha and restores the newest cache, so a
      # PR starts from the last main or dev run. Turbo then replays any task
      # whose inputs did not change.
      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Every import is declared in its package.json, nothing reaches into
      # another workspace by path, and the layer tags in turbo.json hold.
      - name: Package boundaries
        run: bun run turbo boundaries

      # hacklytics2026 is archived: its code stays in the repo, but nothing
      # lints, typechecks, tests or builds it here (vitest.config.ts skips its
      # tests). Build it locally with pnpm --filter hacklytics2026 build.
      - name: Lint and typecheck
        run: bun run turbo run lint typecheck --filter=!hacklytics2026

      # The compose database with its schema and fake data. DATABASE_URL stays
      # on these steps: the build must not look for a database that is gone.
      # Waits for the background start, then local:up db is a no-op for the
      # container (already healthy) and pushes the schema and seeds.
      - name: Start test database
        run: |
          for _ in $(seq 120); do
            [ -f "$RUNNER_TEMP/db-up.exit" ] && break
            sleep 1
          done
          if [ "$(cat "$RUNNER_TEMP/db-up.exit" 2>/dev/null)" != "0" ]; then
            echo "Background database start did not succeed:"
            cat "$RUNNER_TEMP/db-up.log"
            exit 1
          fi
          bun run local:up db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/neondb

      - name: Test
        run: bun run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/neondb
          # Opts in the tests that write to a real database. Only the throwaway
          # CI database is ever set here.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/neondb

      - name: Stop test database
        if: always()
        run: bun run local:down

      - name: Build
        run: bun run turbo run build --filter=!hacklytics2026

      - name: Upload Hacklytics build
        uses: actions/upload-artifact@v7
        with:
          name: hacklytics-out
          path: sites/hacklytics2027/out
          retention-days: 3

  preview-hacklytics:
    name: Preview Hacklytics
    needs: verify
    # Forks and Dependabot get no repo secrets, so the deploy would fail on a
    # missing service account. The verify job above still checks their build.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: hacklytics-out
          path: sites/hacklytics2027/out

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DSGT_WEBSITE }}
          target: hacklytics
          projectId: dsgt-website
          channelId: pr-${{ github.event.pull_request.number }}
          entryPoint: "."
          # 15.34.1 checks the Service Usage API, which is disabled on dsgt-website.
          firebaseToolsVersion: "15.34.0"

  deploy-hacklytics:
    name: Deploy Hacklytics
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: hacklytics-out
          path: sites/hacklytics2027/out

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DSGT_WEBSITE }}
          target: hacklytics
          projectId: dsgt-website
          channelId: live
          entryPoint: "."
          # 15.34.1 checks the Service Usage API, which is disabled on dsgt-website.
          firebaseToolsVersion: "15.34.0"
