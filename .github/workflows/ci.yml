name: CI/CD

# One pipeline: every PR and every push to main/dev is linted, typechecked,
# tested and built once. Hacklytics deploys only from that verified build —
# a preview channel per PR, live on main. mainweb is not deployed here:
# Firebase App Hosting builds it from main itself (apphosting.yaml).
on:
  push:
    branches: ["main", "dev"]
    tags: ["panel-v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # No version pin: the one in packageManager is the one that reads
      # overrides and allowBuilds from pnpm-workspace.yaml. Pinning here
      # silently installed an older pnpm that ignores both.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm turbo run lint typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm turbo run build

      - name: Upload Hacklytics build
        uses: actions/upload-artifact@v4
        with:
          name: hacklytics-out
          path: sites/hacklytics2027/out
          retention-days: 3

  preview-hacklytics:
    name: Preview Hacklytics
    needs: verify
    # Forks and Dependabot get no repo secrets, so the deploy would fail on a
    # missing service account. The verify job above still checks their build.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: hacklytics-out
          path: sites/hacklytics2027/out

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DSGT_WEBSITE }}
          target: hacklytics
          projectId: dsgt-website
          channelId: pr-${{ github.event.pull_request.number }}
          entryPoint: "."

  deploy-hacklytics:
    name: Deploy Hacklytics
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: hacklytics-out
          path: sites/hacklytics2027/out

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DSGT_WEBSITE }}
          target: hacklytics
          projectId: dsgt-website
          channelId: live
          entryPoint: "."

  publish-judging:
    name: Publish judging images
    needs: verify
    if: startsWith(github.ref, 'refs/tags/panel-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/judging-server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/panel-server:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sites/judging/Dockerfile
          push: true
          build-args: NEXT_PUBLIC_PANEL_URL=${{ vars.NEXT_PUBLIC_PANEL_URL || 'http://localhost:8787' }}
          tags: ghcr.io/${{ github.repository }}/panel-web:${{ github.ref_name }}
