name: CI/CD

# One pipeline: every PR and every push to main/dev is linted, typechecked,
# tested and built once. Hacklytics deploys only from that verified build —
# a preview channel per PR, live on main. mainweb is not deployed here:
# Firebase App Hosting builds it from main itself (apphosting.yaml).
on:
  push:
    branches: ["main", "dev"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Boundaries, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-lint-${{ runner.os }}-

      # Every import is declared in its package.json, nothing reaches into
      # another workspace by path, and the layer tags in turbo.json hold.
      - name: Package boundaries
        run: pnpm turbo boundaries

      # hacklytics2026 is archived: its code stays in the repo, but nothing
      # lints, typechecks, tests or builds it here (vitest.config.ts skips its
      # tests). Build it locally with pnpm --filter hacklytics2026 build.
      - name: Lint and typecheck
        run: pnpm turbo run lint typecheck --filter=!hacklytics2026

  # Two halves of the suite, each on its own runner with its own throwaway
  # database. Vitest splits the files; the tests never share a database across
  # runners, as they never shared one across files.
  test:
    name: Test (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6

      # Start only the database now, in the background, so the image pull and
      # boot overlap install. Mailpit is not used by tests. The marker file
      # tells the next database step when this has finished.
      - name: Start test database in the background
        run: |
          nohup setsid bash -c '
            docker compose -f docker/compose.local.yml -f docker/compose.ci.yml up -d db
            echo $? > "$RUNNER_TEMP/db-up.exit"
          ' > "$RUNNER_TEMP/db-up.log" 2>&1 &

      - uses: ./.github/actions/install

      # The compose database with its schema and fake data. DATABASE_URL stays
      # on these steps: the build must not look for a database that is gone.
      # Waits for the background start, then local:up db is a no-op for the
      # container (already healthy) and pushes the schema and seeds.
      - name: Start test database
        run: |
          for _ in $(seq 120); do
            [ -f "$RUNNER_TEMP/db-up.exit" ] && break
            sleep 1
          done
          if [ "$(cat "$RUNNER_TEMP/db-up.exit" 2>/dev/null)" != "0" ]; then
            echo "Background database start did not succeed:"
            cat "$RUNNER_TEMP/db-up.log"
            exit 1
          fi
          pnpm local:up db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/neondb

      - name: Test
        run: pnpm test --shard=${{ matrix.shard }}/2
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/neondb
          # Opts in the tests that write to a real database. Only the throwaway
          # CI database is ever set here.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/neondb

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install

      # Encoding the photos is the slowest part of the build, about 50s. They
      # change only when a source photo or the encoder does, so the key is a
      # hash of those. No restore-keys on purpose: an older set would be marked
      # fresh below and a changed photo would ship stale.
      - name: Restore encoded photos
        id: photos
        uses: actions/cache@v6
        with:
          path: sites/mainweb/public/photos
          key: photos-${{ hashFiles('sites/mainweb/assets/images/photos/*', 'sites/mainweb/image-sizes.mjs', 'sites/mainweb/scripts/build-photos.ts') }}

      # build-photos.ts skips a file that is newer than its source. The sources
      # were just checked out, so restored files would look older and be
      # encoded again.
      - name: Mark restored photos fresh
        if: steps.photos.outputs.cache-hit == 'true'
        run: find sites/mainweb/public/photos -type f -exec touch {} +

      # Next 16 builds with Turbopack, which writes its cache to .next/cache and
      # reuses it on the next build, but only if that folder comes back first.
      # Each run saves under its own sha and restores the newest, preferring
      # one from the same lockfile. Turborepo does not keep this folder.
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: sites/mainweb/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Build
        run: pnpm turbo run build --filter=!hacklytics2026 --no-cache

      - name: bench diagnostic
        run: grep -rho "Check your email [0-9]*" sites/mainweb/.next/server | sort -u

      - name: Upload Hacklytics build
        uses: actions/upload-artifact@v7
        with:
          name: hacklytics-out
          path: sites/hacklytics2027/out
          retention-days: 3

  # The one check the branch rulesets require. It fails unless every job above
  # succeeded, so a skipped or cancelled job cannot read as a pass. The preview
  # and deploy jobs wait on it, which keeps Hacklytics deploying only from a
  # fully verified build.
  verify:
    name: Lint, typecheck, test, build
    needs: [check, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done

  preview-hacklytics:
    name: Preview Hacklytics
    needs: verify
    # Forks and Dependabot get no repo secrets, so the deploy would fail on a
    # missing service account. The verify job above still checks their build.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: hacklytics-out
          path: sites/hacklytics2027/out

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DSGT_WEBSITE }}
          target: hacklytics
          projectId: dsgt-website
          channelId: pr-${{ github.event.pull_request.number }}
          entryPoint: "."
          # 15.34.1 checks the Service Usage API, which is disabled on dsgt-website.
          firebaseToolsVersion: "15.34.0"

  deploy-hacklytics:
    name: Deploy Hacklytics
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: hacklytics-out
          path: sites/hacklytics2027/out

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DSGT_WEBSITE }}
          target: hacklytics
          projectId: dsgt-website
          channelId: live
          entryPoint: "."
          # 15.34.1 checks the Service Usage API, which is disabled on dsgt-website.
          firebaseToolsVersion: "15.34.0"
