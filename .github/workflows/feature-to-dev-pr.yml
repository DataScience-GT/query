name: Auto PR feature to dev

on:
  push:
    branches-ignore:
      - main
      - dev
      - "dependabot/**"
      # Cloud-agent branches already open a PR into main as the human owner.
      # Auto-opening a second PR into dev (authored by github-actions, titled
      # with the cursor/ prefix) duplicates review and is not wanted.
      - "cursor/**"

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create or Update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through env, never interpolated into the script: git allows $, (, )
          # and | in branch names, so ${{ github.ref_name }} inside run: let a
          # pushed branch name execute shell with this job's write token.
          BRANCH: ${{ github.ref_name }}
        run: |
          # Only "a PR already exists" is expected; anything else should fail
          # the job rather than be swallowed by || true. Same-repo PRs only: a
          # fork's branch of the same name must not suppress this one.
          open=$(gh pr list --head "$BRANCH" --base dev --state open --json isCrossRepository --jq '[.[] | select(.isCrossRepository | not)] | length')
          if [ "$open" = "0" ]; then
            gh pr create \
              --base dev \
              --head "$BRANCH" \
              --title "Feature: $BRANCH to dev" \
              --body "Automated PR tracking changes from \`$BRANCH\` into \`dev\`." \
              --reviewer aamoghS \
              --assignee aamoghS \
              --label ":arrow_heading_down: pull"
          fi
